<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>体育回放 · 末段倒放</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <h1>末段倒放回放</h1>
    <section class="panel">
      <div class="row">
        <button id="loadSample">加载示例视频</button>
        <label class="file">
          打开本地 MP4
          <input id="fileInput" type="file" accept="video/mp4">
        </label>
        <span id="mediaInfo" class="muted"></span>
      </div>
      <video id="preview" controls muted></video>
    </section>

    <section class="panel">
      <h2>倒放区间</h2>
      <div class="row">
        <label>起点 <span id="startLabel">–</span>s
          <input id="startRange" type="range" min="0" max="12" step="0.033" value="10">
        </label>
        <label>终点 <span id="endLabel">–</span>s
          <input id="endRange" type="range" min="0" max="12" step="0.033" value="12">
        </label>
        <button id="last2s">最后 2 秒</button>
      </div>
      <div class="row">
        <button id="prepare">准备倒放片段</button>
        <span id="prepareStatus" class="muted"></span>
      </div>
    </section>

    <section class="panel">
      <h2>倒放播放</h2>
      <canvas id="stage" width="960" height="540"></canvas>
      <div class="row">
        <button id="playPause" disabled>播放</button>
        <button id="restart" disabled>从头重播</button>
        <progress id="playhead" max="1" value="0"></progress>
        <span id="clock" class="muted">0.000 / 0.000 s</span>
      </div>
    </section>

    <section class="panel">
      <h2>导出</h2>
      <div class="row">
        <button id="exportBtn" disabled>导出倒放片段</button>
        <span id="exportStatus" class="muted"></span>
      </div>
      <video id="exportPreview" controls></video>
      <div class="row" id="downloadRow"></div>
      <pre id="reportView"></pre>
    </section>
  </main>
  <script type="module" src="/src/app/main.ts"></script>
</body>
</html>
