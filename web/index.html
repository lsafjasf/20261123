<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>FRAME/SAFE — 胶片扫描修复</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 13px/1.5 system-ui, sans-serif; background: #14161a; color: #d7dae0; }
  header { padding: 10px 16px; background: #1d2026; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 15px; margin: 0; letter-spacing: 1px; }
  main { display: grid; grid-template-columns: 1fr 320px; gap: 12px; padding: 12px 16px; }
  fieldset { border: 1px solid #2c313a; border-radius: 6px; margin: 0 0 10px; padding: 8px 10px; }
  legend { color: #8b93a1; padding: 0 4px; }
  label { display: inline-flex; gap: 6px; align-items: center; margin: 2px 8px 2px 0; }
  input[type=number] { width: 60px; }
  input, select, button { background: #23272f; color: #d7dae0; border: 1px solid #3a404c; border-radius: 4px; padding: 4px 8px; }
  button { cursor: pointer; }
  button:hover { background: #2c313b; }
  canvas#view { width: 100%; background: #000; border-radius: 6px; image-rendering: pixelated; }
  #transport { display: flex; gap: 8px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  #scrub { flex: 1; min-width: 160px; }
  #masklist { max-height: 260px; overflow: auto; font-family: ui-monospace, monospace; font-size: 12px; }
  #masklist div { padding: 2px 4px; border-bottom: 1px solid #23272f; }
  .locked { color: #e0b45c; } .motion { color: #6fa8dc; } .repaired { color: #7fc97f; }
  #status { color: #8b93a1; }
  video#webmPreview { width: 100%; border-radius: 6px; background: #000; }
</style>
</head>
<body>
<header>
  <h1>FRAME/SAFE · 胶片扫描时序修复</h1>
  <span id="status">离线运行 · 无外部依赖</span>
</header>
<main>
  <section>
    <canvas id="view" width="960" height="540"></canvas>
    <div id="transport">
      <button id="play">▶ 播放</button>
      <button id="prev">⟨</button>
      <button id="next">⟩</button>
      <input id="scrub" type="range" min="0" max="0" value="0">
      <span id="frameLabel">—</span>
      <select id="viewMode">
        <option value="repaired">修复后</option>
        <option value="original">原始</option>
        <option value="mask">遮罩叠加</option>
      </select>
    </div>
    <fieldset>
      <legend>输入</legend>
      <label>帧序列(PNG/JPEG) <input id="seqInput" type="file" multiple accept="image/*"></label>
      <label>或视频 <input id="videoInput" type="file" accept="video/*"></label>
    </fieldset>
    <fieldset>
      <legend>参数</legend>
      <label>名称 <input id="name" value="REEL_01" size="10"></label>
      <label>fps <input id="fps" type="number" value="24"></label>
      <label>修复强度 <input id="strength" type="number" min="0" max="1" step="0.01" value="0.78"></label>
      <label>颗粒保留 <input id="grain" type="number" min="0" max="1" step="0.01" value="0.96"></label>
      <button id="run">运行修复</button>
    </fieldset>
    <fieldset>
      <legend>导出</legend>
      <button id="exportZip">修复序列 + 遮罩 (.zip)</button>
      <button id="exportWebm">WebM 视频</button>
      <button id="exportManifest">mask-manifest.json</button>
      <video id="webmPreview" controls hidden></video>
    </fieldset>
  </section>
  <aside>
    <fieldset>
      <legend>当前帧</legend>
      <div><label><input id="frameEnabled" type="checkbox" checked> 本帧启用修复</label></div>
      <div><label><input id="frameManual" type="checkbox"> 人工修过</label>
      <label>导入人工帧 <input id="manualImport" type="file" accept="image/*"></label></div>
      <div id="frameInfo"></div>
    </fieldset>
    <fieldset>
      <legend>遮罩清单</legend>
      <div id="masklist"></div>
    </fieldset>
    <fieldset>
      <legend>锁定竖线（视为画面内容）</legend>
      <div id="lockedlist"></div>
    </fieldset>
  </aside>
</main>
<script type="module" src="./dist/app.js"></script>
</body>
</html>
